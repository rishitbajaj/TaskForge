services:
  database:
    image: mongo:latest
    container_name: taskforge_mongodb
    ports:
      - "27019:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: taskforge_backend
    ports:
      - "5001:5000"
    environment:
      - MONGO_URI=mongodb://database:27017/TaskForge
      - CLIENT_URL=http://localhost:3001
      - JWT_SECRET=taskforge-dev-secret-change-in-production
      - PORT=5000
    depends_on:
      - database

  frontend:
    build: ./frontend
    container_name: taskforge_frontend
    ports:
      - "3001:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5001
      - WDS_SOCKET_PORT=0
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true
    depends_on:
      - backend

volumes:
  mongo_data:
